---
# Apply k3s node-level configuration changes (resolv.conf, kubelet args,
# sysctls, etc.) to an already-running cluster with a rolling restart.
#
# Run this after editing anything that lands in:
#   - /etc/k3s-resolv.conf  (managed by common_prereqs)
#   - /etc/rancher/k3s/config.yaml  (managed by setup's template)
# i.e. after editing roles/k3s/common_prereqs or roles/k3s/setup.
#
# Order: refresh static files on every node (no restart), then rolling restart
# control planes (serial: 1), then rolling restart agents (serial: 1).

- name: roeden | refresh on-node config files
  hosts: k3s_servers:k3s_agents
  become: true
  gather_facts: true
  tasks:
    - name: Re-apply common_prereqs (incl. /etc/k3s-resolv.conf)
      include_role:
        name: ../../roles/k3s/common_prereqs

    - name: Re-render /etc/rancher/k3s/config.yaml
      template:
        src: ../../roles/k3s/setup/templates/k3s-config.yaml.j2
        dest: /etc/rancher/k3s/config.yaml
        mode: "0644"

- name: roeden | rolling restart — control planes
  hosts: k3s_servers
  become: true
  gather_facts: false
  serial: 1
  max_fail_percentage: 0
  roles:
    - role: ../../roles/k3s/node_reconfigure

- name: roeden | rolling restart — agents
  hosts: k3s_agents
  become: true
  gather_facts: false
  serial: 1
  max_fail_percentage: 0
  roles:
    - role: ../../roles/k3s/node_reconfigure

# A running pod's /etc/resolv.conf is set once at pod start by kubelet — it
# doesn't auto-refresh when the host's /etc/k3s-resolv.conf changes. CoreDNS
# in particular needs a kick so it picks up the new upstream nameservers;
# without this, pods get NXDOMAIN for anything the OLD upstream couldn't
# resolve, even though k3s is happily using the new file for new pods.
- name: roeden | restart CoreDNS so it picks up the new resolv.conf
  hosts: k3s-cp1
  become: true
  gather_facts: false
  tasks:
    - name: Rollout-restart CoreDNS deployment
      command: >
        kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml
        -n kube-system rollout restart deploy/coredns
      changed_when: true

    - name: Wait for CoreDNS rollout to finish
      command: >
        kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml
        -n kube-system rollout status deploy/coredns
        --timeout=120s
      changed_when: false
