---
# Compare each k3s node's running version against the latest released k3s,
# the configured kube-vip image tag against the latest kube-vip release,
# and the configured Traefik chart version against the latest chart release.
# Read-only — does not change anything on the cluster.

- name: roeden | fetch latest released versions
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Query GitHub for latest k3s release
      uri:
        url: https://api.github.com/repos/k3s-io/k3s/releases/latest
        return_content: true
        headers:
          Accept: application/vnd.github+json
      register: k3s_latest_release

    - name: Stash latest k3s version tag
      set_fact:
        k3s_latest_version: "{{ k3s_latest_release.json.tag_name }}"

    - name: Query GitHub for latest kube-vip release
      uri:
        url: https://api.github.com/repos/kube-vip/kube-vip/releases/latest
        return_content: true
        headers:
          Accept: application/vnd.github+json
      register: kubevip_latest_release

    - name: Stash latest kube-vip version + parse configured tag
      set_fact:
        kubevip_latest_version: "{{ kubevip_latest_release.json.tag_name }}"
        kubevip_current_version: "{{ hostvars[groups['k3s_servers'][0]].kubevip_image | regex_replace('^.*:', '') }}"

    - name: Query GitHub for latest Traefik chart release
      uri:
        url: https://api.github.com/repos/traefik/traefik-helm-chart/releases/latest
        return_content: true
        headers:
          Accept: application/vnd.github+json
      register: traefik_latest_release

    - name: Stash latest + configured Traefik chart versions
      set_fact:
        traefik_latest_version: "{{ traefik_latest_release.json.tag_name | regex_replace('^v', '') }}"
        traefik_current_version: "{{ hostvars[groups['k3s_servers'][0]].traefik_chart_version | regex_replace('^v', '') }}"

    - name: Query GitHub for latest cert-manager release
      uri:
        url: https://api.github.com/repos/cert-manager/cert-manager/releases/latest
        return_content: true
        headers:
          Accept: application/vnd.github+json
      register: cert_manager_latest_release

    - name: Stash latest + configured cert-manager versions
      set_fact:
        cert_manager_latest_version: "{{ cert_manager_latest_release.json.tag_name }}"
        cert_manager_current_version: "{{ hostvars[groups['k3s_servers'][0]].cert_manager_chart_version }}"

    - name: Query GitHub for latest Gateway API release
      uri:
        url: https://api.github.com/repos/kubernetes-sigs/gateway-api/releases/latest
        return_content: true
        headers:
          Accept: application/vnd.github+json
      register: gateway_api_latest_release

    - name: Stash latest + configured Gateway API versions
      set_fact:
        gateway_api_latest_version: "{{ gateway_api_latest_release.json.tag_name }}"
        gateway_api_current_version: "{{ hostvars[groups['k3s_servers'][0]].gateway_api_version }}"

    - name: Query NFS provisioner helm repo index
      uri:
        url: https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner/index.yaml
        return_content: true
      register: nfs_provisioner_index

    - name: Stash latest + configured NFS provisioner versions
      set_fact:
        nfs_provisioner_latest_version: "{{ (nfs_provisioner_index.content | from_yaml).entries['nfs-subdir-external-provisioner'][0].version }}"
        nfs_provisioner_current_version: "{{ hostvars[groups['k3s_servers'][0]].nfs_provisioner_chart_version | regex_replace('^v', '') }}"

    - name: Query ArgoCD helm repo index
      uri:
        url: https://argoproj.github.io/argo-helm/index.yaml
        return_content: true
      register: argocd_index

    - name: Stash latest + configured ArgoCD versions
      set_fact:
        argocd_latest_version: "{{ (argocd_index.content | from_yaml).entries['argo-cd'][0].version }}"
        argocd_current_version: "{{ hostvars[groups['k3s_servers'][0]].argocd_chart_version | regex_replace('^v', '') }}"

    - name: Query kube-prometheus-stack helm repo index
      uri:
        url: https://prometheus-community.github.io/helm-charts/index.yaml
        return_content: true
      register: kps_index

    - name: Stash latest + configured kube-prometheus-stack versions
      set_fact:
        kps_latest_version: "{{ (kps_index.content | from_yaml).entries['kube-prometheus-stack'][0].version }}"
        kps_current_version: "{{ hostvars[groups['k3s_servers'][0]].kps_chart_version | regex_replace('^v', '') }}"

    - name: Query Grafana helm repo index (Loki + Alloy live here)
      uri:
        url: https://grafana.github.io/helm-charts/index.yaml
        return_content: true
      register: grafana_index

    - name: Stash latest + configured Loki + Alloy + Tempo versions
      set_fact:
        loki_latest_version: "{{ (grafana_index.content | from_yaml).entries['loki'][0].version }}"
        loki_current_version: "{{ hostvars[groups['k3s_servers'][0]].loki_chart_version | regex_replace('^v', '') }}"
        alloy_latest_version: "{{ (grafana_index.content | from_yaml).entries['alloy'][0].version }}"
        alloy_current_version: "{{ hostvars[groups['k3s_servers'][0]].alloy_chart_version | regex_replace('^v', '') }}"
        tempo_latest_version: "{{ (grafana_index.content | from_yaml).entries['tempo'][0].version }}"
        tempo_current_version: "{{ hostvars[groups['k3s_servers'][0]].tempo_chart_version | regex_replace('^v', '') }}"

    - name: Query OpenBao helm repo index
      uri:
        url: https://openbao.github.io/openbao-helm/index.yaml
        return_content: true
      register: openbao_index

    - name: Stash latest + configured OpenBao versions
      set_fact:
        openbao_latest_version: "{{ (openbao_index.content | from_yaml).entries['openbao'][0].version }}"
        openbao_current_version: "{{ hostvars[groups['k3s_servers'][0]].openbao_chart_version | regex_replace('^v', '') }}"

    - name: Query Gitea helm repo index
      uri:
        url: https://dl.gitea.com/charts/index.yaml
        return_content: true
      register: gitea_index

    - name: Stash latest + configured Gitea versions
      set_fact:
        gitea_latest_version: "{{ (gitea_index.content | from_yaml).entries['gitea'][0].version }}"
        gitea_current_version: "{{ hostvars[groups['k3s_servers'][0]].gitea_chart_version | regex_replace('^v', '') }}"

    - name: Query Authentik helm repo index
      uri:
        url: https://charts.goauthentik.io/index.yaml
        return_content: true
      register: authentik_index

    - name: Stash latest + configured Authentik versions
      set_fact:
        authentik_latest_version: "{{ (authentik_index.content | from_yaml).entries['authentik'][0].version }}"
        authentik_current_version: "{{ hostvars[groups['k3s_servers'][0]].authentik_chart_version | regex_replace('^v', '') }}"

    - name: Query GitHub for latest Valkey release
      uri:
        url: https://api.github.com/repos/valkey-io/valkey/releases/latest
        return_content: true
        headers:
          Accept: application/vnd.github+json
      register: valkey_latest_release

    - name: Stash latest Valkey version + parse configured tag
      set_fact:
        valkey_latest_version: "{{ valkey_latest_release.json.tag_name }}"
        # Strip image prefix + any base-OS suffix (-trixie / -alpine / -bookworm)
        valkey_current_version: "{{ hostvars[groups['k3s_servers'][0]].valkey_image | regex_replace('^.*:', '') | regex_replace('-(trixie|alpine|bookworm).*$', '') }}"

    - name: Query GitHub for latest HAProxy tags
      # HAProxy doesn't use GitHub releases — only tags. Most-recent first;
      # filter -dev to get the newest stable.
      uri:
        url: https://api.github.com/repos/haproxy/haproxy/tags?per_page=30
        return_content: true
        headers:
          Accept: application/vnd.github+json
      register: haproxy_tags_list

    - name: Stash latest HAProxy stable version + parse configured tag
      set_fact:
        haproxy_latest_version: >-
          {{ haproxy_tags_list.json
             | rejectattr('name', 'search', '-dev')
             | map(attribute='name')
             | map('regex_replace', '^v', '')
             | first }}
        haproxy_current_version: "{{ hostvars[groups['k3s_servers'][0]].postgres_proxy_image | regex_replace('^.*:', '') | regex_replace('-(alpine|trixie|bookworm).*$', '') }}"

- name: roeden | gather current k3s versions
  hosts: k3s_servers:k3s_agents
  become: true
  gather_facts: false
  tasks:
    - name: Run k3s --version
      command: /usr/local/bin/k3s --version
      register: k3s_version_raw
      changed_when: false

    - name: Parse running k3s version
      set_fact:
        k3s_current_version: >-
          {{ (k3s_version_raw.stdout_lines[0]
              | regex_search('v[0-9]+\.[0-9]+\.[0-9]+\+k3s[0-9]+'))
             | default('unknown', true) }}

    - name: Build per-host version line
      set_fact:
        k3s_version_line: "{{ '%-10s' | format(inventory_hostname) }} {{ '%-16s' | format(k3s_current_version) }} {% if k3s_current_version == hostvars['localhost'].k3s_latest_version %}(up to date){% else %}(behind){% endif %}"

- name: roeden | version report
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Build kube-vip report line
      set_fact:
        kubevip_line: "{{ '%-12s' | format('kube-vip') }} {{ '%-16s' | format(kubevip_current_version) }} {% if kubevip_current_version == kubevip_latest_version %}(up to date){% else %}(behind, latest {{ kubevip_latest_version }}){% endif %}"

    - name: Build Traefik report line
      set_fact:
        traefik_line: "{{ '%-12s' | format('traefik') }} {{ '%-16s' | format(traefik_current_version) }} {% if traefik_current_version == traefik_latest_version %}(up to date){% else %}(behind, latest {{ traefik_latest_version }}){% endif %}"

    - name: Build cert-manager report line
      set_fact:
        cert_manager_line: "{{ '%-12s' | format('cert-manager') }} {{ '%-16s' | format(cert_manager_current_version) }} {% if cert_manager_current_version == cert_manager_latest_version %}(up to date){% else %}(behind, latest {{ cert_manager_latest_version }}){% endif %}"

    - name: Build Gateway API report line
      set_fact:
        gateway_api_line: "{{ '%-12s' | format('gateway-api') }} {{ '%-16s' | format(gateway_api_current_version) }} {% if gateway_api_current_version == gateway_api_latest_version %}(up to date){% else %}(behind, latest {{ gateway_api_latest_version }}){% endif %}"

    - name: Build NFS provisioner report line
      set_fact:
        nfs_provisioner_line: "{{ '%-12s' | format('nfs-prov') }} {{ '%-16s' | format(nfs_provisioner_current_version) }} {% if nfs_provisioner_current_version == nfs_provisioner_latest_version %}(up to date){% else %}(behind, latest {{ nfs_provisioner_latest_version }}){% endif %}"

    - name: Build ArgoCD report line
      set_fact:
        argocd_line: "{{ '%-12s' | format('argocd') }} {{ '%-16s' | format(argocd_current_version) }} {% if argocd_current_version == argocd_latest_version %}(up to date){% else %}(behind, latest {{ argocd_latest_version }}){% endif %}"

    - name: Build kube-prometheus-stack report line
      set_fact:
        kps_line: "{{ '%-12s' | format('kube-prom') }} {{ '%-16s' | format(kps_current_version) }} {% if kps_current_version == kps_latest_version %}(up to date){% else %}(behind, latest {{ kps_latest_version }}){% endif %}"

    - name: Build Loki report line
      set_fact:
        loki_line: "{{ '%-12s' | format('loki') }} {{ '%-16s' | format(loki_current_version) }} {% if loki_current_version == loki_latest_version %}(up to date){% else %}(behind, latest {{ loki_latest_version }}){% endif %}"

    - name: Build Alloy report line
      set_fact:
        alloy_line: "{{ '%-12s' | format('alloy') }} {{ '%-16s' | format(alloy_current_version) }} {% if alloy_current_version == alloy_latest_version %}(up to date){% else %}(behind, latest {{ alloy_latest_version }}){% endif %}"

    - name: Build Tempo report line
      set_fact:
        tempo_line: "{{ '%-12s' | format('tempo') }} {{ '%-16s' | format(tempo_current_version) }} {% if tempo_current_version == tempo_latest_version %}(up to date){% else %}(behind, latest {{ tempo_latest_version }}){% endif %}"

    - name: Build OpenBao report line
      set_fact:
        openbao_line: "{{ '%-12s' | format('openbao') }} {{ '%-16s' | format(openbao_current_version) }} {% if openbao_current_version == openbao_latest_version %}(up to date){% else %}(behind, latest {{ openbao_latest_version }}){% endif %}"

    - name: Build Gitea report line
      set_fact:
        gitea_line: "{{ '%-12s' | format('gitea') }} {{ '%-16s' | format(gitea_current_version) }} {% if gitea_current_version == gitea_latest_version %}(up to date){% else %}(behind, latest {{ gitea_latest_version }}){% endif %}"

    - name: Build Authentik report line
      set_fact:
        authentik_line: "{{ '%-12s' | format('authentik') }} {{ '%-16s' | format(authentik_current_version) }} {% if authentik_current_version == authentik_latest_version %}(up to date){% else %}(behind, latest {{ authentik_latest_version }}){% endif %}"

    - name: Build Valkey report line
      set_fact:
        valkey_line: "{{ '%-12s' | format('valkey') }} {{ '%-16s' | format(valkey_current_version) }} {% if valkey_current_version == valkey_latest_version %}(up to date){% else %}(behind, latest {{ valkey_latest_version }}){% endif %}"

    - name: Build HAProxy (postgres-proxy) report line
      set_fact:
        haproxy_line: "{{ '%-12s' | format('haproxy') }} {{ '%-16s' | format(haproxy_current_version) }} {% if haproxy_current_version == haproxy_latest_version %}(up to date){% else %}(behind, latest {{ haproxy_latest_version }}){% endif %}"

    - name: Print version drift report
      debug:
        msg: "{{ ['Latest k3s release: ' ~ k3s_latest_version, 'Latest kube-vip release: ' ~ kubevip_latest_version, 'Latest Traefik chart release: ' ~ traefik_latest_version, 'Latest cert-manager release: ' ~ cert_manager_latest_version, 'Latest Gateway API release: ' ~ gateway_api_latest_version, 'Latest NFS provisioner chart: ' ~ nfs_provisioner_latest_version, 'Latest ArgoCD chart: ' ~ argocd_latest_version, 'Latest kube-prometheus-stack chart: ' ~ kps_latest_version, 'Latest Loki chart: ' ~ loki_latest_version, 'Latest Alloy chart: ' ~ alloy_latest_version, 'Latest Tempo chart: ' ~ tempo_latest_version, 'Latest OpenBao chart: ' ~ openbao_latest_version, 'Latest Gitea chart: ' ~ gitea_latest_version, 'Latest Authentik chart: ' ~ authentik_latest_version, 'Latest Valkey release: ' ~ valkey_latest_version, 'Latest HAProxy stable: ' ~ haproxy_latest_version, '', 'k3s running versions:'] + ((groups['k3s_servers'] + groups['k3s_agents']) | map('extract', hostvars, 'k3s_version_line') | list) + ['', 'Cluster components (configured):', kubevip_line, traefik_line, cert_manager_line, gateway_api_line, nfs_provisioner_line, argocd_line, kps_line, loki_line, alloy_line, tempo_line, openbao_line, gitea_line, authentik_line, valkey_line, haproxy_line] }}"
