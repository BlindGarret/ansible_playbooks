---
# Auto-generate the cluster join token on the controller if it's not already
# in artifacts/. Once generated, it stays forever — rotating it requires
# coordinating across every node.
- name: roeden | bootstrap k3s secrets if missing
  hosts: localhost
  gather_facts: false
  roles:
    - role: ../../roles/local/ensure_random_secrets
      vars:
        ensure_random_secrets:
          - path: "{{ k3s_token_path }}"
            description: "k3s cluster join token"

- name: roeden | k3s HA bootstrap
  hosts: k3s_servers:k3s_agents
  become: true
  gather_facts: true
  roles:
    - ../../roles/k3s/common_prereqs
    - ../../roles/lab/trust_internal_cert

- name: roeden | bootstrap cp1
  hosts: k3s-cp1
  become: true
  gather_facts: false
  roles:
    - role: ../../roles/k3s/setup

- name: roeden | bring up API VIP (kube-vip)
  hosts: k3s-cp1
  become: true
  gather_facts: false
  roles:
    - ../../roles/k3s/vip

- name: roeden | join other control planes
  hosts: k3s_servers:!k3s-cp1
  become: true
  gather_facts: false
  serial: 1
  roles:
    - role: ../../roles/k3s/setup

- name: roeden | k3s agents
  hosts: k3s_agents
  become: true
  gather_facts: false
  serial: 2
  roles:
    - role: ../../roles/k3s/setup

- name: roeden | base platform addons
  hosts: k3s-cp1
  become: true
  gather_facts: false
  roles:
    - ../../roles/k3s/metallb
    - ../../roles/k3s/kubeconfig