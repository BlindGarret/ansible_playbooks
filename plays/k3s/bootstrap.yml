---
- name: roeden | k3s HA bootstrap
  hosts: k3s_servers:k3s_agents
  become: true
  gather_facts: true
  roles:
    - ../../roles/k3s/common_prereqs

- name: roeden | bootstrap cp1
  hosts: k3s-cp1
  become: true
  gather_facts: false
  roles:
    - role: ../../roles/k3s/setup

- name: roeden | bring up API VIP (kube-vip)
  hosts: k3s-cp1
  become: true
  gather_facts: false
  roles:
    - ../../roles/k3s/vip

- name: roeden | join other control planes
  hosts: k3s_servers:!k3s-cp1
  become: true
  gather_facts: false
  serial: 1
  roles:
    - role: ../../roles/k3s/setup

- name: roeden | k3s agents
  hosts: k3s_agents
  become: true
  gather_facts: false
  serial: 2
  roles:
    - role: ../../roles/k3s/setup

- name: roeden | base platform addons
  hosts: k3s-cp1
  become: true
  gather_facts: false
  roles:
    - ../../roles/k3s/metallb
    - ../../roles/k3s/kubeconfig