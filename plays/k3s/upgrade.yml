- name: roeden | OpenBao upgrade
  hosts: k3s-cp1
  become: true
  gather_facts: false
  tasks:
    - name: Read deployed OpenBao chart version
      command: >
        helm list -n {{ openbao_namespace }}
        --filter ^openbao$
        --kubeconfig /etc/rancher/k3s/k3s.yaml
        -o json
      register: openbao_helm_list
      changed_when: false
      failed_when: false

    - name: Parse deployed OpenBao chart version
      set_fact:
        openbao_deployed_version: >-
          {{ (openbao_helm_list.stdout | from_json | first).chart
             | default('')
             | regex_replace('^openbao-', '') }}
      when: openbao_helm_list.rc == 0 and openbao_helm_list.stdout | length > 2

    - name: Skip OpenBao — already at target
      debug:
        msg: "OpenBao already at {{ openbao_chart_version }}"
      when: openbao_deployed_version | default('') == openbao_chart_version

    # Full role does helm upgrade + wait + unseal + configure. The role's
    # tasks/main.yml is idempotent: init step is conditional on artifacts/,
    # unseal skips already-unsealed pods, configure skips already-enabled
    # mounts. So this is safe to re-run every upgrade.
    - name: Upgrade OpenBao chart
      include_role:
        name: k3s/openbao
      when: openbao_deployed_version | default('') != openbao_chart_version

    # When NO helm upgrade ran, still sweep for sealed pods — covers the
    # case where a pod was rescheduled (node power-cycle, evict, etc.) and
    # came up sealed between upgrade windows. Idempotent — no-op when all
    # pods are already unsealed. (When the chart DID upgrade above, main.yml
    # already ran unseal, so we skip this branch to avoid the double-call.)
    - name: Sweep for sealed OpenBao pods (idempotent)
      include_role:
        name: k3s/openbao
        tasks_from: unseal.yml
      when: openbao_deployed_version | default('') == openbao_chart_version

- name: roeden | internal leaf cert renewal
  hosts: k3s-cp1
  become: true
  gather_facts: false
  roles:
    - role: ../../roles/k3s/internal_leaf_cert
