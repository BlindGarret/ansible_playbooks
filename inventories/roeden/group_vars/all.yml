# Cluster identity
k3s_cluster_name: roeden

# Stable API endpoint
k3s_api_vip: 192.168.10.20
kubevip_interface: eth0 
kubevip_image: "ghcr.io/kube-vip/kube-vip:v1.2.0"
k3s_api_server_url: "https://{{ k3s_api_vip }}:6443"

# k3s version (pin it; upgrade intentionally)
k3s_version: "v1.36.1+k3s1"   # example; set to what you want

# k3s cluster join token. Stored in a gitignored local file; lookup runs on
# the controller, the value is shipped to each node during install.
k3s_token_path: "../../artifacts/k3s-token"
k3s_token: "{{ lookup('file', playbook_dir ~ '/' ~ k3s_token_path) | trim }}"

# Postgres HA cluster (3 VMs running Postgres + Patroni + etcd quorum).
# Each VM has ~4 GiB RAM; tuning sizes assume that.
postgres_cluster_name: "roeden-pg"
postgres_major_version: 18
postgres_etcd_version: "3.6.12"
postgres_superuser_password_path: "../../artifacts/postgres-superuser-password"
postgres_replication_password_path: "../../artifacts/postgres-replication-password"
# Postgres tuning
postgres_shared_buffers: "1GB"
postgres_effective_cache_size: "3GB"
postgres_work_mem: "4MB"
postgres_maintenance_work_mem: "256MB"
postgres_max_connections: 200

# Platform-tier constants shared by every Postgres-related role.
patroni_install_dir: /opt/patroni
patroni_restapi_port: 8008
postgres_listen_port: 5432

# Postgres proxy (HAProxy in k3s, fronting the PG cluster's current leader).
# Apps connect to postgres-rw.postgres.svc:5432 — never to PG VM IPs directly.
# Check https://github.com/haproxy/haproxy/tags (ignore -dev tags; LTS lines
# are even minors: 3.0, 3.2, 3.4)
postgres_proxy_namespace: postgres
postgres_proxy_replicas: 2
postgres_proxy_image: "haproxy:3.4.0-alpine"

# Per-app databases provisioned on the cluster. Each app gets its own DB +
# user; the password lives in artifacts/ and is also what the app's chart
# uses to connect. Add new entries here as you add apps that need PG.
postgres_databases:
  - name: authentik
    user: authentik
    password_path: "../../artifacts/authentik-postgres-password"
  - name: grafana
    user: grafana
    password_path: "../../artifacts/grafana-postgres-password"
  - name: gitea
    user: gitea
    password_path: "../../artifacts/gitea-postgres-password"

# DNS upstream used by pods when the node's /etc/resolv.conf only contains
# loopback nameservers (e.g. systemd-resolved). The NAS handles both internal
# (*.roeden.lab) and external (forwarded upstream) lookups, so we use it
# alone — CoreDNS's default `forward` policy is `random`, so adding a second
# upstream that doesn't know about *.roeden.lab causes ~50% NXDOMAIN flapping.
k3s_kubelet_fallback_dns:
  - 192.168.0.29   # NAS — internal DNS, knows *.roeden.lab + forwards external

# Keep kubeconfig locally after install
k3s_kubeconfig_local_path: "../../artifacts/kubeconfig-{{ k3s_cluster_name }}.yaml"

# Networking (defaults are fine; override if you want)
k3s_cluster_cidr: "10.42.0.0/16"
k3s_service_cidr: "10.43.0.0/16"
k3s_cluster_dns: "10.43.0.10"

# MetalLB pool (L2)
metallb_version: "v0.15.3"
metallb_address_pool: "192.168.10.50-192.168.10.70"

# Optional: decide if control planes can schedule normal pods
k3s_taint_control_plane: true

# Traefik ingress (Gateway API + classic Ingress both enabled)
# Pin to the chart version you want. Check https://github.com/traefik/traefik-helm-chart/releases
traefik_chart_version: "v40.2.0"
traefik_namespace: traefik

# LoadBalancer IPs from the MetalLB pool. Set DNS to these before issuing certs.
traefik_internal_ip: 192.168.10.51
traefik_external_ip: 192.168.10.52
# Gitea SSH (git push/pull over ssh://git@git.roedev.com). On its own LB IP
# rather than sharing one of the Traefik IPs because SSH isn't HTTP — Traefik
# can't host-route raw SSH (no Host header, no SNI in the protocol), so the
# SSH listener has to live on its own IP:port pair. See README "Gitea SSH".
# Router NAT: public :22 → 192.168.10.53.
gitea_ssh_ip: 192.168.10.53

# cert-manager. Check https://github.com/cert-manager/cert-manager/releases
cert_manager_chart_version: "v1.20.2"
cert_manager_namespace: cert-manager

# Gateway API CRDs. Check https://github.com/kubernetes-sigs/gateway-api/releases
gateway_api_version: v1.5.1

# NFS subdir external provisioner — dynamic PVs backed by a NAS export.
# Check https://github.com/kubernetes-sigs/nfs-subdir-external-provisioner/releases
nfs_provisioner_chart_version: "4.0.18"
nfs_provisioner_namespace: nfs-provisioner
nfs_server: "192.168.0.29"
nfs_path: "/volume1/appdata"
nfs_storage_class_name: nfs-client
nfs_default_storage_class: true

# Backup destination — second NFS share on the same NAS, dedicated to
# backups. Cluster workloads (per-app pg_dump via roeden-app chart;
# OpenBao raft snapshot, Gitea dump, Authentik blueprints tar via the
# backup-janitor app) write here. Synology Cloud Sync on the NAS itself
# replicates this share nightly to Backblaze B2 for offsite.
#
# Layout under the share: /<source>/YYYY-MM-DD/<file>
#   /postgres/2026-06-26/mblex.sql
#   /openbao/2026-06-26/snapshot.snap
#   /gitea/2026-06-26/gitea-dump.zip
#   /authentik-blueprints/2026-06-26/blueprints.tar.gz
#
# Kept separate from nfs_path so the perms posture can be tighter (only
# the cluster's backup workloads need rw here) and so a typo in a janitor
# CronJob can't ever touch live PVC data on /volume1/appdata.
#
# See README "Backups" for the one-time NAS-side setup (shared folder,
# NFS export perms, Cloud Sync → B2).
backup_nfs_server: "192.168.0.29"
backup_nfs_path: "/volume1/roeden-backup"

# Backup StorageClass — second nfs-subdir-external-provisioner instance,
# pointed at backup_nfs_path. Apps opt into backups by claiming PVCs of
# storageClassName `nfs-backup`. Subdir naming on the NAS is
# `${PVC.namespace}-${PVC.name}` so restore-time paths are predictable.
# Same chart as the primary provisioner (nfs_provisioner_chart_version) —
# the two installs always move in lockstep.
nfs_backup_provisioner_namespace: nfs-backup-provisioner
nfs_backup_storage_class_name: nfs-backup

# ArgoCD. Check https://github.com/argoproj/argo-helm/releases (filter for argo-cd-*)
argocd_chart_version: "9.5.19"
argocd_namespace: argocd
argocd_hostname: argocd.roeden.lab

# Observability stack. kube-prometheus-stack bundles Prometheus + Alertmanager
# + Grafana + node-exporter + kube-state-metrics + ServiceMonitor CRDs.
# Check https://github.com/prometheus-community/helm-charts/releases (filter for kube-prometheus-stack-*)
kps_chart_version: "86.2.0"
observability_namespace: observability
grafana_hostname: grafana.roeden.lab
# Local file containing the Discord webhook URL for Alertmanager notifications.
discord_webhook_path: "../../artifacts/discord-webhook-url"

# Grafana — state (dashboards, users, settings) lives in the external HA
# Postgres cluster, not in a bundled SQLite PVC. Random password generated
# on first run; rotate by deleting artifacts/grafana-postgres-password and
# the matching PG role + re-running services.yml.
grafana_postgres_password_path: "../../artifacts/grafana-postgres-password"

# Loki — log aggregation, single-binary mode, NFS-backed.
# Check https://github.com/grafana/helm-charts/releases (filter for loki-*)
loki_chart_version: "7.0.0"
loki_retention_days: 14
loki_storage_size: 50Gi

# Grafana Alloy — log shipper DaemonSet that scrapes container logs from
# every node and forwards to Loki. Also receives OTLP traces from apps and
# forwards them to Tempo.
# Check https://github.com/grafana/helm-charts/releases (filter for alloy-*)
alloy_chart_version: "1.8.2"

# Grafana Tempo — distributed tracing backend, single-binary mode, NFS-backed.
# Check https://github.com/grafana/helm-charts/releases (filter for tempo-*)
tempo_chart_version: "1.24.4"
tempo_retention_hours: 168    # 7 days
tempo_storage_size: 20Gi

# Valkey — single-instance Redis-protocol cache, shared across apps.
# BSD-licensed Redis fork maintained by Linux Foundation (AWS/Google/Oracle).
# Apps connect to valkey.valkey.svc:6379 — never use a chart's bundled Redis.
# Cache only: RDB snapshots to NFS, no replication. Restart = users re-login.
# Check https://github.com/valkey-io/valkey/releases
valkey_namespace: valkey
valkey_image: "valkey/valkey:9.1.0-trixie"
valkey_storage_size: 2Gi
valkey_password_path: "../../artifacts/valkey-password"

# Authentik — central identity provider. Postgres lives on the external HA
# cluster (via postgres-rw.postgres.svc); cache lives on Valkey (above).
# Check https://github.com/goauthentik/helm/releases
authentik_chart_version: "2026.5.2"
authentik_namespace: authentik
authentik_hostname: auth.roeden.lab
# These two stay constant for the install's lifetime. Generate once with:
#   openssl rand -base64 60 | tr -d '\n' > artifacts/authentik-secret-key
#   openssl rand -base64 32 | tr -d '\n' > artifacts/authentik-postgres-password
# Don't rotate without coordinating Postgres + Authentik together.
authentik_secret_key_path: "../../artifacts/authentik-secret-key"
authentik_postgres_password_path: "../../artifacts/authentik-postgres-password"

# Authentik blueprints — declarative config for OIDC providers, apps, groups.
# Two channels:
#   1. Platform blueprints: rendered from roles/k3s/authentik/templates/blueprints/
#      into a ConfigMap, mounted at /blueprints/platform/. Owned by this repo.
#   2. App blueprints: an NFS PVC mounted at /blueprints/apps/. Custom apps
#      drop their own *.yaml here (via initContainer/Job) and Authentik
#      picks them up automatically — no Ansible edits per app.
authentik_app_blueprints_storage_size: 1Gi

# Grafana SSO — wired via OAuth2/OIDC at Authentik. The client_secret is
# auto-generated, shared between the Authentik provider (via env var read by
# the blueprint) and the Grafana pod (via env var read by grafana.ini).
# Group membership in Authentik decides Grafana role; lroe (your user) needs
# to be a member of the group named below to get Admin in Grafana.
grafana_oidc_client_secret_path: "../../artifacts/grafana-oidc-client-secret"
grafana_admins_group_name: "grafana-admins"

# ArgoCD SSO — same pattern as Grafana. Members of argocd_admins_group_name
# get the built-in ArgoCD `role:admin`; anyone else is denied (no readonly
# fallback at homelab scale — easier to grant readonly via membership later).
argocd_oidc_client_secret_path: "../../artifacts/argocd-oidc-client-secret"
argocd_admins_group_name: "argocd-admins"

# Authentik external hostname — same Authentik instance, second address.
# Internal apps continue using authentik_hostname (auth.roeden.lab) for OIDC.
# External apps (anything attaching to the traefik-external Gateway) point
# their OIDC discovery at this URL instead, so users on the public internet
# can reach the issuer. Sessions don't span the two hostnames — that's the
# trade-off for keeping the URLs split. See README "Internal vs external SSO".
authentik_external_hostname: auth.roedev.com

# Gateway names — defined as defaults in the gateways role, but referenced
# from other roles (authentik HTTPRoute, future external apps). Role defaults
# aren't visible across role boundaries, so promoted to group_vars. The
# gateways role still uses these via the usual precedence — values match
# what's in roles/k3s/gateways/defaults/main.yml.
internal_gateway_name: internal
external_gateway_name: external

# OpenBao (Apache-2.0 Vault fork). 3-pod raft cluster, NFS PVCs, integrated
# storage. The init step on first run writes the 5 unseal keys + root token
# to artifacts/openbao-init.json — that file is the one and only way to
# unseal the cluster. Protect it like the CA private key.
# Chart 0.28.3 bundles OpenBao v2.5.4.
# Check https://github.com/openbao/openbao-helm/releases
openbao_chart_version: "0.28.3"
openbao_hostname: vault.roeden.lab
openbao_storage_size: 5Gi
openbao_init_keys_path: "../../artifacts/openbao-init.json"
openbao_vault_admin_postgres_password_path: "../../artifacts/openbao-vault-admin-postgres-password"
openbao_oidc_client_secret_path: "../../artifacts/openbao-oidc-client-secret"
openbao_admins_group_name: "openbao-admins"

# Gitea — self-hosted Git + built-in Docker registry + built-in Helm chart
# registry. Replaces "external Git host + separate image registry + separate
# chart registry" with a single service. EXTERNAL ONLY (git.roedev.com)
# because Gitea uses Authentik SSO and SSO-using services must pick one
# network position — OAuth callback URIs canonicalize on a single hostname
# regardless of where the user started, so dual-URL creates a confusing UX
# (start on internal, end on external). LAN users hairpin through CF on
# Git/registry operations; small cost paid for consistency.
# Chart 12.6.0 ships Gitea 1.26.1.
# Check https://gitea.com/gitea/helm-gitea/releases
gitea_chart_version: "12.6.0"
gitea_hostname: git.roedev.com
# Separate hostname for the SSH endpoint so LAN clients can resolve it
# straight to gitea_ssh_ip without going through Cloudflare and the public
# NAT chain (TDS doesn't hairpin :22 reliably). Public DNS already covers
# this via the wildcard *.roedev.com A record. Gitea displays this in the
# UI's clone URLs for SSH, so users land on the right hostname automatically.
gitea_ssh_hostname: git-ssh.roedev.com
gitea_storage_size: 50Gi
gitea_admins_group_name: "gitea-admins"
gitea_postgres_password_path: "../../artifacts/gitea-postgres-password"
gitea_oidc_client_secret_path: "../../artifacts/gitea-oidc-client-secret"
# Internal Gitea secrets — pre-generated so re-deploys against existing data
# (PG + NFS PVC preserved) decrypt cleanly. Lose these AND wipe the data
# dir = lose nothing; lose these but keep the data = unreadable DB.
gitea_jwt_secret_path: "../../artifacts/gitea-jwt-secret"
gitea_secret_key_path: "../../artifacts/gitea-secret-key"
gitea_internal_token_path: "../../artifacts/gitea-internal-token"

# Internal TLS chain. The CA is the trust anchor (distributed to nodes' and
# clients' CA stores). The leaf cert is what Traefik actually serves; it's
# signed by the CA. Both live in artifacts/ which is gitignored.
internal_ca_path: "../../artifacts/roeden-ca.crt"
internal_ca_key_path: "../../artifacts/roeden-ca.key"
internal_cert_path: "../../artifacts/internal-tls.crt"
internal_cert_key_path: "../../artifacts/internal-tls.key"
# Leaf cert lifetime + when to renew. Default: 365-day leaves, renew when 30
# or fewer days remain. ingress.yml runs the renewal check automatically.
internal_leaf_lifetime_days: 365
internal_leaf_rotation_threshold_days: 30

# Domains and contact for cert-manager / Let's Encrypt.
# Set internal_hostnames to what your self-signed cert's SANs cover.
# Set external_hostnames to the public hostnames you want LE to issue for.
internal_hostnames:
  - "roeden.lab"
  - "*.roeden.lab"

# DNS-01 supports wildcards. One cert covers everything; apps just attach
# HTTPRoutes by hostname with no per-app cert config.
external_hostnames:
  - "roedev.com"
  - "*.roedev.com"

external_wildcard_listener: "*.roedev.com"
letsencrypt_email: "lroe2930@gmail.com"

# Start with staging while you iterate, flip to false for prod issuance.
letsencrypt_use_staging: false

# Local file containing your Cloudflare API token (Zone:DNS:Edit, scoped to
# roedev.com only). artifacts/ is gitignored — keep it there.
cloudflare_api_token_path: "../../artifacts/cloudflare-api-token"

# Cluster registry pull credentials. The cluster_puller Gitea user is a
# member of the roeden org; its PAT goes into every k3s node's
# /etc/rancher/k3s/registries.yaml so containerd can pull private images
# from git.roedev.com/roeden/* without per-pod imagePullSecrets. See
# plays/k3s/registry-auth.yml + README §10.5.
cluster_registry_host: git.roedev.com
cluster_puller_username: cluster-puller
cluster_puller_token_path: "../../artifacts/cluster-puller-token"