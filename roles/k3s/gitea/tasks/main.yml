---
- name: Ensure gitea namespace
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ gitea_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ gitea_namespace }}"

# No internal-tls Secret — Gitea is external-only, all traffic comes through
# the external Gateway which already has the *.roedev.com wildcard cert
# attached at the listener level. No per-namespace TLS Secret needed.

# CA ConfigMap mounted into Gitea so its outbound HTTP clients trust
# *.roeden.lab. Used by the OIDC startup init container plus any future
# webhook/CI/CD that talks to other internal services.
- name: Create internal-ca ConfigMap in gitea namespace
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ gitea_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: internal-ca
        namespace: "{{ gitea_namespace }}"
      data:
        ca.crt: "{{ lookup('file', playbook_dir ~ '/' ~ internal_ca_path) }}"

- name: Create Gitea Postgres Secret
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ gitea_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: gitea-pg-secret
        namespace: "{{ gitea_namespace }}"
      stringData:
        password: "{{ lookup('file', playbook_dir ~ '/' ~ gitea_postgres_password_path) | trim }}"

- name: Create Gitea Valkey Secret
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ gitea_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: gitea-valkey-secret
        namespace: "{{ gitea_namespace }}"
      stringData:
        password: "{{ lookup('file', playbook_dir ~ '/' ~ valkey_password_path) | trim }}"

# Internal crypto secrets — pre-generated by ensure_random_secrets in
# services.yml. Pre-generation means a fresh pod against the existing data
# dir and DB decrypts cleanly; without it, Gitea autogenerates at first
# start and stores in app.ini, with all the "what if the PVC gets recreated"
# fragility that implies.
- name: Create Gitea internal secrets
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ gitea_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: gitea-internal-secrets
        namespace: "{{ gitea_namespace }}"
      stringData:
        secret-key: "{{ lookup('file', playbook_dir ~ '/' ~ gitea_secret_key_path) | trim }}"
        internal-token: "{{ lookup('file', playbook_dir ~ '/' ~ gitea_internal_token_path) | trim }}"
        jwt-secret: "{{ lookup('file', playbook_dir ~ '/' ~ gitea_jwt_secret_path) | trim }}"

# OIDC client_secret — mirrored in the authentik namespace by the authentik
# role (where !Env reads it) and consumed here by Gitea's oauth init
# container via the existingSecret reference in values.yaml.j2.
- name: Create Gitea OIDC client_secret in gitea namespace
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ gitea_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: gitea-oidc-secret
        namespace: "{{ gitea_namespace }}"
      stringData:
        key: "gitea"
        secret: "{{ lookup('file', playbook_dir ~ '/' ~ gitea_oidc_client_secret_path) | trim }}"

- name: Render Gitea chart values
  template:
    src: values.yaml.j2
    dest: /tmp/gitea-values.yaml
    mode: "0600"

- name: Install/upgrade Gitea chart
  kubernetes.core.helm:
    name: "{{ gitea_release_name }}"
    chart_ref: "{{ gitea_chart_name }}"
    chart_repo_url: "{{ gitea_chart_repo }}"
    chart_version: "{{ gitea_chart_version }}"
    namespace: "{{ gitea_namespace }}"
    values_files:
      - /tmp/gitea-values.yaml
    kubeconfig: "{{ gitea_kubeconfig }}"
    wait: true
    timeout: 10m

# Sole entry point for Gitea: HTTPRoute attached to the external Gateway.
# The *.roedev.com wildcard cert on that Gateway already covers
# git.roedev.com, so we don't reference any TLS Secret here.
- name: Create HTTPRoute for Gitea (external Gateway, *.roedev.com)
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ gitea_kubeconfig }}"
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: gitea-external
        namespace: "{{ gitea_namespace }}"
      spec:
        parentRefs:
          - name: "{{ external_gateway_name }}"
            namespace: "{{ traefik_namespace }}"
        hostnames:
          - "{{ gitea_hostname }}"
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: gitea-http
                port: 3000
