---
# Reusable unseal logic, called by:
#   - roles/k3s/openbao/tasks/main.yml  (after helm install/upgrade)
#   - plays/k3s/unseal-openbao.yml      (standalone "catastrophic" recovery)
#
# Idempotent: pods already unsealed are skipped.
#
# Three phases:
#   1. Unseal openbao-0 (the leader). On first run, it's the only pod with
#      raft state — the others can't initialize until they retry_join an
#      unsealed leader. On subsequent runs (pod restart), openbao-0 still
#      goes first by convention since it's the canonical leader address in
#      the chart's retry_join config.
#   2. Wait for follower pods (openbao-1..N-1) to report initialized=true.
#      First run: this is how long retry_join takes to discover the leader
#      and pull raft state (~5-30s). Subsequent runs: instant, followers
#      were already initialized from persisted raft state on their PVCs.
#   3. Unseal whichever followers are still sealed. With retry_join the
#      followers may auto-unseal via Shamir on rejoin (depends on chart
#      semantics) — `bao status` rc=2 means we still need to submit keys.

- name: Read OpenBao init keys from artifacts/
  set_fact:
    openbao_init: "{{ lookup('file', playbook_dir ~ '/' ~ openbao_init_keys_path) | from_json }}"
  no_log: true

# --- Phase 1: openbao-0 -------------------------------------------------------
- name: Check seal status of openbao-0
  command: >
    kubectl --kubeconfig {{ openbao_kubeconfig }}
    -n {{ openbao_namespace }}
    exec openbao-0 --
    bao status
  register: openbao_0_status
  failed_when: openbao_0_status.rc not in [0, 2]
  changed_when: false

- name: Unseal openbao-0
  command: >
    kubectl --kubeconfig {{ openbao_kubeconfig }}
    -n {{ openbao_namespace }}
    exec openbao-0 --
    bao operator unseal {{ item }}
  loop: "{{ openbao_init.unseal_keys_b64[:3] }}"
  loop_control:
    label: "openbao-0 (key redacted)"
  when: openbao_0_status.rc == 2
  no_log: true

# --- Phase 2: wait for followers to become initialized via retry_join --------
# `bao status -format=json` writes JSON to stdout regardless of rc (0 unsealed,
# 2 sealed) — we parse stdout regardless and gate on the `initialized` field.
- name: Wait for follower pods to become initialized (retry_join completes)
  command: >
    kubectl --kubeconfig {{ openbao_kubeconfig }}
    -n {{ openbao_namespace }}
    exec {{ item }} --
    bao status -format=json
  register: follower_init_status
  until: (follower_init_status.stdout | default('{}') | from_json).initialized | default(false)
  retries: 60
  delay: 5
  changed_when: false
  failed_when: false
  loop: "{{ range(1, openbao_pod_count) | map('regex_replace', '^(.*)$', 'openbao-\\1') | list }}"

# --- Phase 3: unseal any still-sealed follower --------------------------------
- name: Check seal status of follower pods (post-init)
  command: >
    kubectl --kubeconfig {{ openbao_kubeconfig }}
    -n {{ openbao_namespace }}
    exec {{ item }} --
    bao status
  loop: "{{ range(1, openbao_pod_count) | map('regex_replace', '^(.*)$', 'openbao-\\1') | list }}"
  register: follower_seal_status
  failed_when: false
  changed_when: false

- name: Submit unseal keys to sealed follower pods
  command: >
    kubectl --kubeconfig {{ openbao_kubeconfig }}
    -n {{ openbao_namespace }}
    exec {{ item.0 }} --
    bao operator unseal {{ item.1 }}
  loop: "{{ (follower_seal_status.results
              | selectattr('rc', 'equalto', 2)
              | map(attribute='item')
              | list)
            | product(openbao_init.unseal_keys_b64[:3])
            | list }}"
  loop_control:
    label: "{{ item.0 }}"
  no_log: true

- name: Report unseal outcome
  debug:
    msg: >-
      Unseal pass complete. Followers sealed before phase 3:
      {{ follower_seal_status.results
           | selectattr('rc', 'equalto', 2)
           | map(attribute='item')
           | list }}.
