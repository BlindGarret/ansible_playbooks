---
- name: Install base packages
  apt:
    update_cache: true
    name:
      - curl
      - ca-certificates
      - jq
      - socat
      - conntrack
      - iptables
      - ebtables
      - ethtool
      - open-iscsi
      - nfs-common
    state: present

- name: Disable swap (runtime)
  command: swapoff -a
  when: ansible_facts["swaptotal_mb"] | int > 0
  changed_when: false

- name: Disable swap (fstab)
  replace:
    path: /etc/fstab
    regexp: '^(\s*[^#].*\s+swap\s+.*)$'
    replace: '# \1'

- name: Persist kernel modules for k8s networking
  copy:
    dest: /etc/modules-load.d/k3s.conf
    mode: "0644"
    content: |
      overlay
      br_netfilter

- name: Load overlay module
  modprobe:
    name: overlay
    state: present

- name: Load br_netfilter module
  modprobe:
    name: br_netfilter
    state: present

- name: Set sysctls for Kubernetes networking
  copy:
    dest: /etc/sysctl.d/99-kubernetes-cri.conf
    mode: "0644"
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1

- name: Apply sysctls
  command: sysctl --system
  changed_when: false

- name: Ensure time sync is enabled (systemd-timesyncd)
  systemd:
    name: systemd-timesyncd
    enabled: true
    state: started