---
k3s_kubeconfig_remote: /etc/rancher/k3s/k3s.yaml
# Pick a control plane that's NOT the current host (for cp loops) — for agent
# loops this naturally falls through to the first cp.
drain_delegate: "{{ (groups['k3s_servers'] | difference([inventory_hostname]))[0] }}"
# Server nodes run the `k3s` unit; agents run `k3s-agent`.
k3s_unit: "{{ 'k3s' if 'k3s_servers' in group_names else 'k3s-agent' }}"
