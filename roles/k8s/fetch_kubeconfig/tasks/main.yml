---
# tasks file for fetch_kubeconfig

- name: fetch kubeconfig
  ansible.builtin.fetch:
    src: /home/{{ansible_ssh_user}}/.kube/{{ item }}
    dest: ~/fetched
  loop:
    - config
    - kubeadm.yaml

- name: Remove kubeconfig
  delegate_to: localhost
  ansible.builtin.file:
    path: ~/.kube
    state: absent
    
- name: Move the kube dir
  delegate_to: localhost
  ansible.builtin.shell:
   cmd: mv ~/fetched/{{ ansible_hostname }}/home/{{ ansible_ssh_user }}/.kube ~/.kube
  changed_when: true

- name: Remove yaml
  delegate_to: localhost
  ansible.builtin.file:
    path: ~/fetched
    state: absent
