---
# tasks file for kubeadm_init

- name: Check Component Status
  become: false
  ansible.builtin.command:
   cmd: kubectl get cs
  register: kubecs
  ignore_errors: true
  no_log: true
  changed_when: false

- name: Kubeadm init
  ansible.builtin.command:
   cmd: "kubeadm init --apiserver-advertise-address={{ ansible_ssh_host }} --control-plane-endpoint={{ ansible_ssh_host }} --pod-network-cidr=10.244.0.0/16 --cri-socket=unix:///var/run/crio/crio.sock"
  changed_when: true
  when: '"refused" in kubecs.stderr'

- name: Create kube dir in home
  ansible.builtin.file:
   path: "/home/{{ansible_ssh_user}}/.kube"
   state: directory
   owner: "{{ansible_ssh_user}}"
   mode: '0755'
  when: '"refused" in kubecs.stderr'

- name: Wait for kube config to exist
  ansible.builtin.wait_for:
   path: /etc/kubernetes/admin.conf
  when: '"refused" in kubecs.stderr'

- name: Copy kube config
  ansible.builtin.copy:
   src: /etc/kubernetes/admin.conf
   remote_src: true
   dest: "/home/{{ansible_ssh_user}}/.kube/config"
   owner: "{{ansible_ssh_user}}"
   mode: '0644'
  when: '"refused" in kubecs.stderr'

- name: Wait for safety
  ansible.builtin.pause:
   seconds: 15
  when: '"refused" in kubecs.stderr'

- name: Create ADM Init config
  ansible.builtin.shell:
   cmd: kubeadm config print init-defaults > /home/{{ansible_ssh_user}}/.kube/kubeadm.yaml
   creates: /home/{{ansible_ssh_user}}/.kube/kubeadm.yaml
  changed_when: false

