# Disable Swap
- name: Check Security-Enhanced Linux enforced status
  ansible.builtin.command:
    cmd: swapon -s
  register: swapstatus
  changed_when: false
- name: Disable SWAP since kubernetes can't work with swap enabled (1/2)
  ansible.builtin.command:
    cmd: swapoff -a
  changed_when: true
  when: swapstatus.stdout != ""
- name: Disable SWAP since kubernetes can't work with swap enabled (2/2)
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*?\sswap\s+.*)$'
    replace: '# \1'

# Disable SE Linux
- name: Check Security-Enhanced Linux enforced status
  ansible.builtin.command:
    cmd: getenforce
  register: selinuxenfored
  changed_when: false
- name: Set Enforce Security-Enhanced Linux to zero
  ansible.builtin.command:
    cmd: setenforce 0
  changed_when: true
  when: selinuxenfored.stdout == "Enforcing"
- name: Set Security-Enhanced Linux to permissive
  ansible.builtin.replace:
    path: /etc/selinux/config
    regexp: ^SELINUX=enforcing$
    replace: SELINUX=permissive

# add overlayfs and BRNetFilter to kernel modules
- name: Update Modules K8s config
  ansible.builtin.copy:
    dest: '/etc/modules-load.d/k8s.conf'
    content: |
        overlay
        br_netfilter
    mode: '0777'
  changed_when: true
- name: Modeprobe OverlayFS
  community.general.modprobe:
    name: overlay
- name: Modeprobe BRNetFilter
  community.general.modprobe:
    name: br_netfilter

# Update sysctl k8s config
- name: Update Sysctl K8s config
  ansible.builtin.copy:
    dest: '/etc/sysctl.d/k8s.conf'
    content: |
        net.bridge.bridge-nf-call-iptables  = 1
        net.bridge.bridge-nf-call-ip6tables = 1
        net.ipv4.ip_forward                 = 1
    mode: '0777'
  changed_when: true
- name: Apply sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: true

# Disable Firewall
#  Yes I hate this too. But no mater what I open for ports I can't get it to play nice
#  posts i've found have suggested it's a bug in the actual implementation of firewalld
#  so for now we disable it
- name: Stop and disable firewalld
  ansible.builtin.service:
    name: firewalld
    state: stopped
    enabled: False

# Setup portmap

- name: register status of /opt/cni/bin/portmap
  stat:
    path: /opt/cni/bin/portmap
  register: portmap_file

- name: Install unzip
  ansible.builtin.yum:
    name:
      - unzip
      - tar
    state: present
- name: Create bin dir
  when: "not portmap_file.stat.exists"
  ansible.builtin.file:
    path: /opt/cni/bin
    state: directory
    mode: '0755'
- name: Download portmap
  when: "not portmap_file.stat.exists"
  ansible.builtin.get_url:
    url: "{{ portmap_override_url | default('https://github.com/containernetworking/plugins/releases/download/v' + portmap_version + '/cni-plugins-linux-amd64-v' + portmap_version + '.tgz') }}"
    dest: /home/{{jb_username}}/portmap.tgz
    mode: '0664'
- name: Extract
  when: "not portmap_file.stat.exists"
  ansible.builtin.unarchive:
    src: /home/{{jb_username}}/portmap.tgz
    dest: /opt/cni/bin
    remote_src: yes
- name: Remove tgz
  ansible.builtin.file:
    path: /home/{{jb_username}}/portmap.tgz
    state: absent
