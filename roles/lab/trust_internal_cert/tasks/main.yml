---
# Install the roeden self-signed cert into the host's CA trust store so that
# anything on the box (curl, k8s clients, app code) trusts *.roeden.lab without
# --insecure flags. Reads the cert from the controller side via lookup; the
# resolved path is `{{ playbook_dir }}/{{ internal_cert_path }}`.

- name: Install internal CA cert into trust store
  copy:
    content: "{{ lookup('file', playbook_dir ~ '/' ~ internal_cert_path) }}"
    dest: /usr/local/share/ca-certificates/roeden-internal.crt
    owner: root
    group: root
    mode: "0644"
  register: roeden_cert_install

- name: Refresh CA trust store
  command: update-ca-certificates
  when: roeden_cert_install.changed
